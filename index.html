<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    /> -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; connect-src 'self';font-src 'self'; img-src 'self' data: https:; style-src 'self' ; script-src 'self'"
    />
    <link href="./css/styles.css" rel="stylesheet" />
    <title>pegasus - Image Processing Tool</title>
  </head>

  <body>
    <div id="toolBox1">
      <button title="resize" id="resizeBtn">
        <img class="icon" src="assets/resize.ico" />
      </button>
      <button title="crop" id="cropBtn">
        <img class="icon" src="assets/crop.ico" />
      </button>
      <button title="filter" id="filterBtn">
        <img class="icon" src="assets/filter.ico" />
      </button>
      <button title="rotate" id="rotateBtn">
        <img class="icon" src="assets/rotate.ico" />
      </button>
      <button title="paint" id="paintBtn">
        <img class="icon" src="assets/paint.ico" />
      </button>
    </div>

    <button title="undo" id="undoBtn">
      <img class="icon" src="assets/undo.ico" />
    </button>
    <button id="redoBtn">
      <img title="redo" class="icon" src="assets/redo.ico" />
    </button>

    <label id="showImageOnlyLabel"
      ><input id="showImageOnlyCheckBox" type="checkbox" />Show Image
      Only</label
    >
    <div id="convert_msg" class="alert-box">Converted Successfully</div>
    <div id="save_msg" class="alert-box">Saved Successfully</div>
    <div id="copy_msg" class="alert-box">Color Copied</div>
    <div id="img_copy_msg" class="alert-box">Image Copied</div>
    <div id="img_paste_msg" class="alert-box">Image Pasted</div>
    <div id="delete_msg" class="alert-box">Deleted</div>
    <div id="error_msg" class="alert-box">Sorry. Couldn't open image...</div>

    <script src="./renderer/main_renderer.js"></script>
  </body>
</html>
